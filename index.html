<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2a1810">
  <meta name="description" content="Diário alimentar pessoal, offline, com dados só no seu aparelho.">
  <title>JPlate</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <div class="splash" id="splash" aria-hidden="true">
    <div class="splash-art">
      <img src="assets/splash.jpg" alt="">
      <i class="splash-shine"></i>
    </div>
    <div class="splash-text">
      <h1>JPlate</h1>
      <p>by <b>JPCOMPANY</b></p>
    </div>
  </div>
  <header class="topbar" id="topbar"></header>
  <main id="view" tabindex="-1"></main>
  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
  <nav class="drawer" id="drawer" aria-label="Menu" aria-hidden="true" inert>
    <button class="drawer-head" data-tab="settings" id="drawer-head"></button>
    <ul class="drawer-list">
      <li><button data-tab="diary">Meu Diário</button></li>
      <li><button data-tab="plan">Minha Dieta</button></li>
      <li><button data-tab="weight">Peso</button></li>
      <li><button data-tab="foods">Biblioteca de Alimentos</button></li>
      <li><button data-tab="faq">Dúvidas frequentes</button></li>
      <li><button data-tab="settings">Perfil</button></li>
      <li><button data-tab="about">Sobre o app</button></li>
    </ul>
  </nav>
  <dialog id="sheet" class="sheet"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="src/app.js"></script>
</body>
</html>
